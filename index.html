<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To My Missou</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffe6e6;
            font-family: sans-serif;
            overflow: hidden;
        }
        h1 { color: #d63384; text-align: center; margin-bottom: 30px; }
        
        .btn-container {
            display: flex;
            gap: 50px; /* مسافة واضحة بين الأزرار */
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            z-index: 1000;
        }

        #yesBtn { background-color: #28a745; color: white; position: relative; }
        
        #noBtn { 
            background-color: #dc3545; 
            color: white; 
            position: relative; 
            transition: all 0.3s ease;
        }

        .result-img {
            display: none;
            width: 350px;
            max-width: 90%;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="mainUI">
        <h1>To my Missou: Will you be my Valentine?</h1>
        <div class="btn-container">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <img id="stitchImg" class="result-img" src="" alt="Stitch">

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainUI = document.getElementById('mainUI');
        const stitchImg = document.getElementById('stitchImg');
        
        let noCount = 0;

        function move() {
            // تحويل الزر إلى absolute عند أول محاولة حركة فقط
            if (noBtn.style.position !== 'absolute') {
                noBtn.style.position = 'absolute';
            }
            
            // تحديد مساحة الحركة (مع ترك هامش 100 بكسل من كل جهة)
            const padding = 100;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const x = Math.random() * maxX + (padding/2);
            const y = Math.random() * maxY + (padding/2);

            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // الحركة للحاسوب (الماوس)
        noBtn.addEventListener('mouseover', move);
        
        // الحركة أو إظهار الصورة عند الضغط (للجوال)
        noBtn.addEventListener('click', () => {
            noCount++;
            if (noCount >= 3) {
                showResult('Angery.png'); 
            } else {
                move();
            }
        });

        yesBtn.addEventListener('click', () => {
            showResult('Happy.png');
        });

        function showResult(imgName) {
            mainUI.style.display = 'none';
            noBtn.style.display = 'none';
            stitchImg.src = imgName;
            stitchImg.style.display = 'block';
        }
    </script>
</body>
</html>
