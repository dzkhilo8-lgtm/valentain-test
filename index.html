<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To My Beautiful Missou</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        h1 { color: #d63384; text-align: center; padding: 0 20px; z-index: 1; }

        .container { text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* تعديل لجعل الأزرار بجانب بعضها في البداية */
        .buttons { 
            margin-top: 20px; 
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            width: 100%;
            height: 60px;
            align-items: center;
        }

        button {
            padding: 15px 35px;
            font-size: 1.3rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            z-index: 100;
        }

        #yesBtn { background-color: #28a745; color: white; transition: 0.3s; }
        
        #noBtn { 
            background-color: #dc3545; 
            color: white; 
            transition: all 0.3s ease; /* سرعة متوسطة ومنتظمة */
        }

        .result-img {
            display: none;
            width: 400px;
            max-width: 90%;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div id="mainContent" class="container">
        <h1 id="question">To my beautiful Missou: Will you be my Valentine?</h1>
        <div class="buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div id="result" class="container" style="display: none;">
        <img id="stitchImg" class="result-img" src="" alt="Stitch Result">
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainContent = document.getElementById('mainContent');
        const resultDiv = document.getElementById('result');
        const stitchImg = document.getElementById('stitchImg');

        let noCount = 0;
        let isMoving = false;

        function moveButton() {
            // تحويل الزر إلى وضعية absolute فقط عند أول حركة ليبدأ بالهروب
            if (!isMoving) {
                noBtn.style.position = 'absolute';
                isMoving = true;
            }

            // تحديد حدود الشاشة بدقة مع ترك هامش أمان كبير (150 بكسل)
            const margin = 150;
            const maxX = window.innerWidth - noBtn.offsetWidth - margin;
            const maxY = window.innerHeight - noBtn.offsetHeight - margin;

            // توليد إحداثيات لا تخرج عن الحواف أبداً
            const randomX = Math.max(margin, Math.floor(Math.random() * maxX));
            const randomY = Math.max(margin, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // الحركة عند الاقتراب
        noBtn.addEventListener('mouseover', moveButton);

        // الحركة عند الضغط
        noBtn.addEventListener('click', () => {
            noCount++;
            if (noCount >= 3) {
                showResult('Angery.png'); 
            } else {
                moveButton();
            }
        });

        yesBtn.addEventListener('click', () => {
            showResult('Happy.png');
        });

function showResult(imageSrc) {
            mainContent.style.display = 'none';
            resultDiv.style.display = 'block';
            stitchImg.src = imageSrc;
            stitchImg.style.display = 'block';
            noBtn.style.display = 'none'; 
        }
    </script>
</body>
</html>
