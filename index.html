<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To My Missou</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        h1 { color: #d63384; text-align: center; padding: 0 20px; transition: 0.5s; }

        .container { text-align: center; position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .buttons { margin-top: 20px; display: flex; justify-content: center; gap: 20px; }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            z-index: 100;
        }

        #yesBtn { background-color: #28a745; color: white; transition: 0.3s; }
        #yesBtn:hover { transform: scale(1.1); }

        #noBtn { 
            background-color: #dc3545; 
            color: white; 
            position: absolute; 
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* حركة انسيابية ممتعة */
        }

        .result-container {
            display: none;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        .result-img {
            width: 350px;
            max-width: 85%;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            margin-top: 10px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="mainContent" class="container">
        <h1 id="question">To my Missou: Will you be my Valentine?</h1>
        <div class="buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div id="result" class="container" style="display: none;">
        <div class="result-container" id="resContainer">
            <img id="stitchImg" class="result-img" src="" alt="Stitch Result">
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const mainContent = document.getElementById('mainContent');
        const resultDiv = document.getElementById('result');
        const resContainer = document.getElementById('resContainer');
        const stitchImg = document.getElementById('stitchImg');

        let noCount = 0;

        function moveButton() {
            // حساب المساحة المتاحة مع ترك هامش أمان للحواف
            const padding = 100;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding/2, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding/2, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // حركة عند الاقتراب بالماوس
        noBtn.addEventListener('mouseover', moveButton);

        // حركة عند الضغط (للموبايل)
        noBtn.addEventListener('click', () => {
            noCount++;
            if (noCount >= 3) {
                showFinalResult('Angery.png'); 
            } else {
                moveButton();
            }
        });

        yesBtn.addEventListener('click', () => {
            showFinalResult('Happy.png');
        });

function showFinalResult(imageSrc) {
            mainContent.style.display = 'none';
            noBtn.style.display = 'none'; // التأكد من اختفاء زر No
            resultDiv.style.display = 'flex';
            resContainer.style.display = 'block';
            stitchImg.src = imageSrc;
        }
    </script>
</body>
</html>
